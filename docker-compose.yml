version: '3.8'

services:
  # Main application
  vkord-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vkord-api
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000;
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=vkord;Username=vkord_user;Password=${DB_PASSWORD}
      - OpenRouterSettings__ApiKey=${OPENROUTER_API_KEY}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - RedisSettings__ConnectionString=redis:6379
      - DaDataSettings__ApiToken=${DADATA_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vkord-network
    volumes:
      - logs:/app/logs
      - ./ssl:/app/ssl:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database (v17)
  postgres:
    image: postgres:17-alpine
    container_name: vkord-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vkord
      - POSTGRES_USER=vkord_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - vkord-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vkord_user -d vkord"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: vkord-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vkord-network
    command: redis-server --appendonly yes

  # Nginx reverse proxy (optional, for production deployment)
  nginx:
    image: nginx:alpine
    container_name: vkord-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - vkord-api
    networks:
      - vkord-network

  # Background Jobs (Hangfire)
  jobs:
    build:
      context: .
      dockerfile: Dockerfile.jobs
    container_name: vkord-jobs
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=vkord;Username=vkord_user;Password=${DB_PASSWORD}
      - RedisSettings__ConnectionString=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vkord-network
    volumes:
      - jobs_logs:/app/logs
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/hangfire"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  logs:
  jobs_logs:

networks:
  vkord-network:
    driver: bridge

